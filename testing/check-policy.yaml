# Which of this repo's CI checks gate a merge, and which do not.
#
# Required by the Testing Standard § "The declaration is machine-readable, not
# prose". Consumed by the dispatch pipeline's merge gate (merge-pr.py), which
# refuses a merge verdict while a blocking check is red — and refuses with
# `no_policy` when this file is absent. That refusal is what this file was
# written in response to: PR #6 rewrote 908 lines of the skyy-command bootstrap
# to clone over HTTPS with a placed token, passed six review passes, and could
# not be merged by the helper because this repo declared no gate at all.
#
# It is NOT read by GitHub — required status checks are a paid feature on
# private repos and are deliberately not pursued across this fleet. Per the
# Testing Standard, a dispatch pipeline that reads this file and refuses to
# emit a merge verdict on red IS a gate in full; the mechanism differs, the
# control does not.
#
# NAMES ARE THE REPORTED CHECK NAME, VERBATIM — the JOB id as `gh pr checks`
# prints it, not the workflow name or the filename.
#
# `blocking` means: IF IT APPEARS AND IS NOT GREEN, STOP. `tests` is
# unfiltered (no paths:, no if:), so it appears on every PR and a verdict
# always exists.

blocking:
  - tests                 # .github/workflows/tests.yml — testing/run-all.sh:
                          # bash -n + shellcheck over every shell file in the tree

# An entry MUST name what is consequently not covered.
advisory:
  - name: CodeQL
    reason: >-
      GitHub CodeQL default setup, configured in the repo settings and not by
      any file here; it reports on PRs as this summary check and as one
      `Analyze (<language>)` job per language it detects. Its status is the
      scan's JOB status, so red means the scan did not COMPLETE, not that it
      found something — gating on it would let GitHub's scanner breaking halt
      this repo's merges. Same ruling as claude-dot-files' check-policy.yaml.
      NOT COVERED: a PR whose scan failed merges unscanned; default setup's
      scan of the default branch catches it after the fact.
  - name: Analyze (actions)
    reason: >-
      CodeQL default setup's job for the `actions` language — it scans
      .github/workflows/, not the installer scripts. Same reasoning and same
      uncovered class as CodeQL above. First observed undeclared on PR #9.
